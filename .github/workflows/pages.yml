# GitHub Pages への公開
#
# main に push すると、テストを通したうえで静的書き出し（out/）を
# https://<ユーザー名>.github.io/refcite/ へ配信する。
# データは各利用者の端末（IndexedDB）にのみ置かれ、ここには何も送られない。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 壊れた書式や保存処理を配信しないよう、テストが落ちたら公開しない
      - run: npm test
      - run: npm run build
        env:
          # リポジトリ名の下に置かれるため（lib/base.ts）
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # _next/ のような _ で始まるフォルダを Jekyll に捨てさせない
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
